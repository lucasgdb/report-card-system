type Admin implements Node {
  avatarURL: String

  """Codes for the `discipline_id` column of the grades spreadsheet."""
  disciplines: [DisciplineCode!]!
  email: String!
  firstname: String!
  fullname: String!
  id: ID!
  lastname: String
  notifications(after: String, before: String, first: Int, last: Int): NotificationConnection

  """Requests waiting for an admin (shown next to the menu item)."""
  pendingStudentPasswordRecoveryRequestCount: Int!
  studentPasswordRecoveryRequests(after: String, before: String, first: Int, last: Int): StudentPasswordRecoveryRequestConnection
  students(after: String, before: String, first: Int, last: Int): StudentConnection
}

input AdminLoginMutationInput {
  clientMutationId: ID
  email: String!
  password: String!
  token: String!
}

type AdminLoginMutationPayload {
  admin: Admin
  clientMutationId: ID
  error: MutationError
}

type AdminPasswordRecoveryRequest implements Node {
  id: ID!
  status: AdminPasswordRecoveryRequestStatusEnum!
}

enum AdminPasswordRecoveryRequestStatusEnum {
  CHANGED
  PENDING
}

"""A bimester's marks; null while not given yet."""
input BimesterMarksInput {
  absences: Int
  grade: Float
  recGrade: Float
}

input ChangeStudentInformationMutationInput {
  RM: String!
  clientMutationId: ID
  fullname: String!
  password: String
  studentId: ID!
}

type ChangeStudentInformationMutationPayload {
  clientMutationId: ID
  error: MutationError
  student: Student
}

"""
A discipline and the code that identifies it in the grades spreadsheet.
"""
type DisciplineCode {
  code: Int!
  name: String!
}

input DisciplineMarksInput {
  bimesters: [BimesterMarksInput!]!
  disciplineCode: Int!
}

input LogoutMutationInput {
  clientMutationId: ID
}

type LogoutMutationPayload {
  clientMutationId: ID
  error: MutationError
}

type Mutation {
  """Signs an admin in: the session goes in an httpOnly cookie."""
  adminLogin(input: AdminLoginMutationInput!): AdminLoginMutationPayload!
  changeStudentInformation(input: ChangeStudentInformationMutationInput!): ChangeStudentInformationMutationPayload!

  """
  Ends the session of the app the request comes from and clears its cookie.
  """
  logout(input: LogoutMutationInput!): LogoutMutationPayload!

  """
  An admin sets a new password with their reset link. Signs them out everywhere.
  """
  recoverAdminPassword(input: RecoverAdminPasswordMutationInput!): RecoverAdminPasswordMutationPayload!
  refuseStudentPasswordRecoveryRequest(input: RefuseStudentPasswordRecoveryRequestMutationInput!): RefuseStudentPasswordRecoveryRequestMutationPayload!

  """Removes the signed-in student's photo."""
  removeAvatar(input: RemoveAvatarMutationInput!): RemoveAvatarMutationPayload!
  removeStudent(input: RemoveStudentMutationInput!): RemoveStudentMutationPayload!

  """
  A student sets a new password with the link an admin sent them. Signs them out everywhere.
  """
  resetStudentPassword(input: ResetStudentPasswordMutationInput!): ResetStudentPasswordMutationPayload!
  saveStudentGrades(input: SaveStudentGradesMutationInput!): SaveStudentGradesMutationPayload!

  """E-mails an admin a link to choose a new password."""
  sendAdminRecoveryEmail(input: SendAdminRecoveryEmailMutationInput!): SendAdminRecoveryEmailMutationPayload!

  """A student who forgot their password asks the admins for a reset link."""
  sendStudentPasswordRecoveryRequest(input: SendStudentPasswordRecoveryRequestMutationInput!): SendStudentPasswordRecoveryRequestMutationPayload!

  """
  Approves a student's request: e-mails them a link to choose a new password (again, if resent).
  """
  sendStudentPasswordResetLink(input: SendStudentPasswordResetLinkMutationInput!): SendStudentPasswordResetLinkMutationPayload!
  setNotificationsAsViewed(input: SetNotificationsAsViewedMutationInput!): SetNotificationsAsViewedMutationPayload!

  """
  Signs a student in to the boletim: the session goes in an httpOnly cookie.
  """
  studentLogin(input: StudentLoginMutationInput!): StudentLoginMutationPayload!
}

"""An expected failure of a mutation, written for the user."""
type MutationError {
  """
  Input field the error refers to; null when it concerns the whole operation.
  """
  field: String

  """Message to show as is (pt-BR)."""
  userMessage: String!
}

interface Node {
  id: ID!
}

type Notification implements Node {
  id: ID!
  message: String!
  sentAt: String!
  title: String!
  viewed: Boolean!
}

type NotificationConnection {
  count: Int!
  edges: [NotificationEdge!]!
  pageInfo: PageInfo!
}

type NotificationEdge {
  cursor: String!
  node: Notification!
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

type Query {
  admin: Admin

  """
  Whether a student password reset link (from the e-mail) can still be used.
  """
  isStudentPasswordResetLinkValid(passwordRecoveryToken: String!, studentPasswordRecoveryRequestId: ID!): Boolean!
  node(id: ID!): Node
  nodes(ids: [ID!]!): [Node]!
  student: Student
  system: System
}

input RecoverAdminPasswordMutationInput {
  adminPasswordRecoveryRequestId: ID!
  clientMutationId: ID
  password: String!
  passwordConfirmation: String!
  passwordRecoveryToken: String!
}

type RecoverAdminPasswordMutationPayload {
  adminPasswordRecoveryRequest: AdminPasswordRecoveryRequest
  clientMutationId: ID
  error: MutationError
}

input RefuseStudentPasswordRecoveryRequestMutationInput {
  clientMutationId: ID
  studentPasswordRecoveryRequestId: ID!
}

type RefuseStudentPasswordRecoveryRequestMutationPayload {
  admin: Admin
  clientMutationId: ID
  error: MutationError
  studentPasswordRecoveryRequest: StudentPasswordRecoveryRequest
}

input RemoveAvatarMutationInput {
  clientMutationId: ID
}

type RemoveAvatarMutationPayload {
  clientMutationId: ID
  error: MutationError
  student: Student
}

input RemoveStudentMutationInput {
  clientMutationId: ID
  studentId: ID!
}

type RemoveStudentMutationPayload {
  clientMutationId: ID
  error: MutationError
  student: Student
}

input ResetStudentPasswordMutationInput {
  clientMutationId: ID
  password: String!
  passwordConfirmation: String!
  passwordRecoveryToken: String!
  studentPasswordRecoveryRequestId: ID!
}

type ResetStudentPasswordMutationPayload {
  clientMutationId: ID
  error: MutationError
}

input SaveStudentGradesMutationInput {
  clientMutationId: ID
  disciplines: [DisciplineMarksInput!]!
  studentId: ID!
  year: Int!
}

type SaveStudentGradesMutationPayload {
  clientMutationId: ID
  error: MutationError
  student: Student
}

type SchoolReport implements Node {
  id: ID!
  schoolReportRows(after: String, before: String, first: Int, last: Int): SchoolReportRowConnection
  year: Int!
}

type SchoolReportRowConnection {
  count: Int!
  edges: [SchoolReportRowEdge!]!
  pageInfo: PageInfo!
}

type SchoolReportRowEdge {
  cursor: String!
  node: SchoolReportRowType!
}

type SchoolReportRowType {
  disciplineCode: Int!
  disciplineName: String!
  firstBimesterAbsences: Int
  firstBimesterGrade: Float
  firstBimesterRecGrade: Float
  fourthBimesterAbsences: Int
  fourthBimesterGrade: Float
  fourthBimesterRecGrade: Float
  id: ID!
  secondBimesterAbsences: Int
  secondBimesterGrade: Float
  secondBimesterRecGrade: Float
  thirdBimesterAbsences: Int
  thirdBimesterGrade: Float
  thirdBimesterRecGrade: Float
}

input SendAdminRecoveryEmailMutationInput {
  clientMutationId: ID
  email: String!
}

type SendAdminRecoveryEmailMutationPayload {
  clientMutationId: ID
  error: MutationError
}

input SendStudentPasswordRecoveryRequestMutationInput {
  RM: String!
  clientMutationId: ID
  email: String!
}

type SendStudentPasswordRecoveryRequestMutationPayload {
  clientMutationId: ID
  error: MutationError
}

input SendStudentPasswordResetLinkMutationInput {
  clientMutationId: ID
  studentPasswordRecoveryRequestId: ID!
}

type SendStudentPasswordResetLinkMutationPayload {
  admin: Admin
  clientMutationId: ID
  error: MutationError
  studentPasswordRecoveryRequest: StudentPasswordRecoveryRequest
}

input SetNotificationsAsViewedMutationInput {
  clientMutationId: ID
  notificationIds: [ID!]!
}

type SetNotificationsAsViewedMutationPayload {
  clientMutationId: ID
  error: MutationError
  notifications: NotificationConnection
}

type Student implements Node {
  RM: String!
  avatarURL: String
  firstname: String!
  fullname: String!
  id: ID!
  lastname: String
  schoolReport: SchoolReport
}

type StudentConnection {
  edges: [StudentEdge!]!
  pageInfo: PageInfo!
}

type StudentEdge {
  cursor: String!
  node: Student!
}

input StudentLoginMutationInput {
  RM: String!
  clientMutationId: ID
  password: String!
  token: String!
}

type StudentLoginMutationPayload {
  clientMutationId: ID
  error: MutationError
  student: Student
}

type StudentPasswordRecoveryRequest implements Node {
  RM: String!
  createdAt: String!
  email: String!
  id: ID!
  status: StudentPasswordRecoveryRequestStatusEnum!
  student: Student
}

type StudentPasswordRecoveryRequestConnection {
  edges: [StudentPasswordRecoveryRequestEdge!]!
  pageInfo: PageInfo!
}

type StudentPasswordRecoveryRequestEdge {
  cursor: String!
  node: StudentPasswordRecoveryRequest!
}

enum StudentPasswordRecoveryRequestStatusEnum {
  """The student chose a new password."""
  CHANGED

  """Approved: the student got a link to choose a new password."""
  LINK_SENT

  """Waiting for an admin."""
  PENDING
  REFUSED
}

type System {
  test: Int
}
