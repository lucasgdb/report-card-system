version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - corepack enable
  pre_build:
    commands:
      - pnpm install --frozen-lockfile --filter @usefaz/server...
  build:
    commands:
      - echo Entered the build phase...
      - pnpm --filter @usefaz/server build
  post_build:
    commands:
      - echo Entered the post_build phase...
      - cp .ci/docker-compose.yml docker-compose.yml
      - echo Finished!

artifacts:
  files:
    - apps/server/**/*
    - packages/shared/**/*
    - docker-compose.yml
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
  base-directory: ./
