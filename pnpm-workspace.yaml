packages:
  - apps/*
  - packages/*

# Versions shared by more than one workspace package. Reference them with "catalog:".
allowBuilds:
  esbuild: true

catalog:
  "@base-ui/react": ^1.9.0
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-table": ^9.3.1
  "@types/node": ^26.6.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  dayjs: ^1.11.23
  graphql: ^16.14.2
  lucide-react: ^1.64.0
  react: ^19.3.1
  react-dom: ^19.3.1
  react-easy-crop: ^6.2.4
  react-relay: ^21.0.1
  react-router: ^7.18.5
  relay-compiler: ^21.0.1
  relay-runtime: ^21.0.1
  sonner: ^2.0.8
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: ^8.3.5
  vite-plugin-relay-lite: ^0.12.0

minimumReleaseAgeExclude:
  - lucide-react@1.64.0

peerDependencyRules:
  allowedVersions:
    # vite-plugin-relay-lite only uses the stable transform plugin API, which Vite 8 keeps.
    vite-plugin-relay-lite>vite: "8"
