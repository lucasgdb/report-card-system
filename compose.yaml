# Development stack. Install the dependencies on the host first (`pnpm install`): the
# containers share the project folder, node_modules included.

x-node: &node
  build:
    context: docker
    dockerfile: node.Dockerfile
  image: usefaz-node:dev
  volumes:
    - .:/src
  environment:
    # node_modules is installed from the host, against the host's pnpm store, so pnpm must
    # not try to reinstall it from inside the container.
    pnpm_config_verify_deps_before_run: "false"
  entrypoint: ["pnpm"]
  command: ["dev"]

services:
  database:
    image: postgres:18-alpine
    container_name: database
    environment:
      POSTGRES_DB: usefaz_database
      POSTGRES_USER: usefaz_user
      POSTGRES_PASSWORD: usefaz_password
    ports:
      - 5432:5432
    volumes:
      - usefaz_database_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usefaz_user -d usefaz_database"]
      interval: 3s
      timeout: 3s
      start_period: 5s

  server:
    <<: *node
    container_name: server
    working_dir: /src/apps/server
    env_file: apps/server/.env
    ports:
      - 3000:3000
      - 9229:9229 # enable nodejs devtools debugger
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/hc').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      start_period: 60s
    depends_on:
      database:
        condition: service_healthy

  boletim:
    <<: *node
    container_name: boletim
    working_dir: /src/apps/boletim
    ports:
      - ${BOLETIM_PORT:-8080}:8080
    depends_on:
      server:
        condition: service_healthy

  admin:
    <<: *node
    container_name: admin
    working_dir: /src/apps/admin
    ports:
      - ${ADMIN_PORT:-8081}:8081
    depends_on:
      server:
        condition: service_healthy

volumes:
  usefaz_database_data:
